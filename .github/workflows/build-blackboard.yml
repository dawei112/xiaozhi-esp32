name: Build Blackboard Firmware

on:
  push:
    branches:
      - feature-blackboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zhengchen-cam
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        shell: bash
        env:
          BOARD: zhengchen/cam
          VARIANT: zhengchen-cam
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name "$VARIANT"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_blackboard_zhengchen-cam
          path: build/merged-binary.bin
          if-no-files-found: error
